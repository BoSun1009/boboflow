function extraLabels(){const t=extras[language];for(const [id,key] of [['export-label','export'],['style-heading','style'],['share-heading','share'],['image-heading','image'],['fit','fit']])document.getElementById(id).textContent=t[key];document.getElementById('map-heading').textContent=`${t.map} / ${current().nodes.length} ${t.steps}`;document.getElementById('motion').textContent=`${t.motion} ${motion?t.on:t.off}`;document.getElementById('motion').setAttribute('aria-pressed',String(motion));const styles=['classic','signal','blueprint','editorial'];document.querySelectorAll('button[data-style]').forEach((b,i)=>{b.replaceChildren();add('span',t.styles[i],b);add('small',t.descriptions[i],b);b.setAttribute('aria-pressed',String(visualStyle===styles[i]))});document.getElementById('style-label').textContent=t.styles[styles.indexOf(visualStyle)]+' ▾';for(const [format,label,note] of [['share',t.shareCard,'1200 × 630 PNG'],['copy',t.copy,t.clipboard]]){const b=document.querySelector(`[data-format="${format}"]`);b.replaceChildren();add('span',label,b);add('small',note,b)}const b=document.getElementById('export');b.replaceChildren();add('span','SVG',b);add('small',t.vector,b)}

async function raster(format,svgOverride=null){const svg=svgOverride||cleanSVG(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('SVG image could not be rendered'));image.src=url});const card=format==='share',canvas=document.createElement('canvas'),base=baseView();canvas.width=card?1200:base.w*2;canvas.height=card?630:base.h*2;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas unavailable');ctx.fillStyle=dark?'#0d1729':'#f8fafc';ctx.fillRect(0,0,canvas.width,canvas.height);if(card){ctx.fillStyle=dark?'#e8effb':'#203149';ctx.font='bold 25px sans-serif';ctx.fillText(current().title,36,47,1128);ctx.fillStyle='#7790aa';ctx.font='12px sans-serif';ctx.fillText('BOBOFLOW / '+extras[language].map,36,73);const scale=Math.min(1128/base.w,485/base.h),w=base.w*scale,h=base.h*scale;ctx.drawImage(image,(1200-w)/2,92+(485-h)/2,w,h);ctx.fillText(language==='en'?'Business interpretation · Review before production use':'业务流程解释 · 生产使用前请复核',36,607)}else ctx.drawImage(image,0,0,canvas.width,canvas.height);const type=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';const blob=await new Promise(resolve=>canvas.toBlob(resolve,type,.94));if(!blob||blob.type!==type)throw new Error(extras[language].unsupported);return blob}finally{URL.revokeObjectURL(url)}}
document.querySelectorAll('[data-format]').forEach(button=>button.onclick=async()=>{const format=button.dataset.format;button.disabled=true;try{if(format==='copy'&&(!navigator.clipboard?.write||!window.ClipboardItem))throw new Error(extras[language].clipError);const blob=await raster(format);if(format==='copy'){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);notify(extras[language].copied)}else{saveBlob(blob,format==='share'?'-share.png':'.'+format);notify(extras[language].saved)}document.getElementById('export-menu').open=false}catch(e){notify(extras[language].failed+e.message)}finally{button.disabled=false}});
