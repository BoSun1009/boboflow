<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>__PAGE_TITLE__</title><style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#16263c;--muted:#63758a;--line:#d8e2ed;--accent:#067d89;--shadow:0 12px 40px #13294409;color-scheme:light}body.dark{--bg:#0b1220;--panel:#131e30;--text:#e5edf8;--muted:#a3b4ca;--line:#2c4059;--accent:#57d4cc;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:27px 30px 20px;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:25px;margin:8px 0}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;color:var(--accent)}.sub{color:var(--muted);font-size:12px}.tools{display:flex;gap:8px;flex-wrap:wrap}button,input{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:10px 13px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.bar{margin:0 30px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{width:280px}.badge{font-size:12px;color:var(--muted);padding:7px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;margin:0 30px 24px}.canvas{height:calc(100vh - 204px);min-height:420px;overflow:auto;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}svg{display:block}aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:23px;overflow:auto;max-height:calc(100vh - 204px)}h2{font-size:18px;line-height:1.5;overflow-wrap:anywhere}p{color:var(--muted);line-height:1.7}h3{font-size:12px;color:var(--accent);margin-top:28px}.evidence{border-top:1px solid var(--line);padding:11px 0;font:12px ui-monospace,monospace;overflow-wrap:anywhere;line-height:1.6}.node{cursor:pointer}.node.dim{opacity:.15}.edge.dim{opacity:.06}.empty{padding:50px;color:var(--muted)}.hint{font-size:11px;margin:18px 0;color:var(--muted)}#status{color:var(--accent)}@media(max-width:900px){header{align-items:flex-start;flex-direction:column;padding:20px}.layout{grid-template-columns:1fr;margin:0 20px}.bar{margin:0 20px 15px}.canvas{height:65vh}aside{max-height:none}h1{font-size:21px}}@media print{header,.bar,aside{display:none}.layout{display:block;margin:0}.canvas{height:auto;overflow:visible;border:0}svg{max-width:100%;height:auto}}
</style></head><body><header><div><div class="eyebrow">BOBOFLOW</div><h1 id="title"></h1><div class="sub">本地生成 · 文件与行号证据 · 不发送网络请求</div></div><div class="tools"><button id="theme">深色模式</button><button id="export">导出 SVG</button><button id="json">导出 JSON</button></div></header><div class="bar"><input id="search" aria-label="搜索模块" placeholder="搜索文件、模块或分组…"><button id="reset">显示全部</button><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="fit">适应画布</button><span class="badge" id="stats"></span><span id="status" role="status"></span></div><main class="layout"><div class="canvas" id="canvas"><svg id="graph" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="项目关系图"></svg></div><aside id="details"><div class="eyebrow">SOURCE EXPLORER</div><h2>从结构找到依据</h2><p>点击节点，查看直接依赖、引用位置和证据类型。搜索会突出匹配节点及其一跳邻居。</p><h3>如何阅读</h3><p>箭头：导入方 → 被导入模块。虚线表示推断关系，实线表示静态证据或手工描述。</p><p>这是静态结构，不证明调用已执行，也不是安全审计。复杂项目请先打开 overview.html。</p><div class="hint">循环依赖位于同一列。可通过画布滚动、＋ / − 缩放浏览。</div></aside></main><script id="data" type="application/json">__GRAPH_DATA__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),ns='http://www.w3.org/2000/svg',svg=document.getElementById('graph'),canvas=document.getElementById('canvas');
const colors=['#0c8e98','#6976cf','#ba7540','#548b58','#b76791','#4b8daa'];let scale=1,selected=null,positions=new Map(),nodeEls=new Map(),edgeEls=[];let W=1000,H=600;
const text=(tag,value,parent,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.append(e);return e};
function el(tag,attrs={},parent=svg){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));parent.append(e);return e}
function shorten(s,n){return [...s].length>n?[...s].slice(0,n-1).join('')+'…':s}
const adjacency=new Map(data.nodes.map(n=>[n.id,[]])),reverse=new Map(data.nodes.map(n=>[n.id,[]]));for(const e of data.edges){adjacency.get(e.source).push(e.target);reverse.get(e.target).push(e.source)}
// Iterative Kosaraju avoids recursion limits for long project dependency chains.
function ranks(){const seen=new Set(),order=[];for(const n of data.nodes){if(seen.has(n.id))continue;const stack=[[n.id,0]];seen.add(n.id);while(stack.length){let f=stack[stack.length-1],out=adjacency.get(f[0]);if(f[1]<out.length){let next=out[f[1]++];if(!seen.has(next)){seen.add(next);stack.push([next,0])}}else{order.push(f[0]);stack.pop()}}}const component=new Map();let count=0;for(const id of order.reverse()){if(component.has(id))continue;const stack=[id];component.set(id,count);while(stack.length){const v=stack.pop();for(const x of reverse.get(v))if(!component.has(x)){component.set(x,count);stack.push(x)}}count++}const outs=Array.from({length:count},()=>new Set()),incoming=Array(count).fill(0),rank=Array(count).fill(0);for(const e of data.edges){const a=component.get(e.source),b=component.get(e.target);if(a!==b&&!outs[a].has(b)){outs[a].add(b);incoming[b]++}}const queue=[];incoming.forEach((n,i)=>{if(!n)queue.push(i)});for(let i=0;i<queue.length;i++){const a=queue[i];for(const b of outs[a]){rank[b]=Math.max(rank[b],rank[a]+1);if(--incoming[b]===0)queue.push(b)}}return new Map(data.nodes.map(n=>[n.id,rank[component.get(n.id)]]))}
function draw(){svg.replaceChildren();nodeEls.clear();edgeEls=[];const dark=document.body.classList.contains('dark'),fg=dark?'#e5edf8':'#16263c',bg=dark?'#131e30':'#ffffff',line=dark?'#829ab4':'#7890a9';const rank=ranks(),cols=new Map(),groups=[...new Set(data.nodes.map(n=>n.group||'模块'))].sort();
for(const n of data.nodes){const r=rank.get(n.id)||0;if(!cols.has(r))cols.set(r,[]);cols.get(r).push(n)}let maxRows=0;for(const [r,nodes] of cols){nodes.sort((a,b)=>(a.group||'').localeCompare(b.group||'')||a.label.localeCompare(b.label));maxRows=Math.max(maxRows,nodes.length);nodes.forEach((n,i)=>positions.set(n.id,{x:52+r*370,y:66+i*134}))}W=Math.max(720,104+cols.size*370-100);H=Math.max(440,110+maxRows*134);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.background=bg;
const defs=el('defs');const marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:line},marker);
for(const e of data.edges){const a=positions.get(e.source),b=positions.get(e.target),same=a.x===b.x;let d;if(e.source===e.target)d=`M ${a.x+220} ${a.y+20} C ${a.x+295} ${a.y-30} ${a.x+295} ${a.y+100} ${a.x+220} ${a.y+60}`;else if(same)d=`M ${a.x+260} ${a.y+42} C ${a.x+310} ${a.y+42} ${b.x+310} ${b.y+42} ${b.x+260} ${b.y+42}`;else d=`M ${a.x+260} ${a.y+42} C ${a.x+310} ${a.y+42} ${b.x-50} ${b.y+42} ${b.x} ${b.y+42}`;const g=el('g',{class:'edge'});el('path',{d,fill:'none',stroke:line,'stroke-width':1.6,'stroke-opacity':.65,'stroke-dasharray':e.confidence==='inferred'?'6 5':'none','marker-end':'url(#arrow)'},g);el('title',{},g).textContent=`${e.source} → ${e.target}: ${e.label||''}`;
if(data.kind==='workflow'&&e.label&&!same){el('text',{x:(a.x+260+b.x)/2,y:(a.y+b.y)/2+30,fill:fg,'font-size':12,'text-anchor':'middle','paint-order':'stroke',stroke:bg,'stroke-width':5,'stroke-linejoin':'round'},g).textContent=shorten(e.label,24)}edgeEls.push([e,g])}
for(const n of data.nodes){const p=positions.get(n.id),c=colors[groups.indexOf(n.group||'模块')%colors.length],g=el('g',{class:'node',tabindex:0,role:'button','aria-label':n.label,transform:`translate(${p.x},${p.y})`});el('rect',{width:260,height:84,rx:12,fill:bg,stroke:c,'stroke-width':1.5},g);el('rect',{x:0,y:20,width:4,height:44,rx:2,fill:c},g);el('text',{x:18,y:23,fill:c,'font-size':10,'font-family':'sans-serif'},g).textContent=shorten(n.group||'模块',35);el('text',{x:18,y:48,fill:fg,'font-size':15,'font-weight':600,'font-family':'sans-serif'},g).textContent=shorten(n.label,27);el('text',{x:18,y:68,fill:line,'font-size':10,'font-family':'sans-serif'},g).textContent=shorten(n.detail||n.id,40);el('title',{},g).textContent=n.detail||n.label;g.addEventListener('click',()=>focusNode(n.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();focusNode(n.id)}});nodeEls.set(n.id,g)}if(!data.nodes.length)el('text',{x:50,y:90,fill:fg,'font-size':20}).textContent='未发现可绘制的模块';resize();highlight()}
function resize(){svg.setAttribute('width',W*scale);svg.setAttribute('height',H*scale)}
function focusNode(id){selected=id;document.getElementById('search').value='';highlight();const node=data.nodes.find(n=>n.id===id),panel=document.getElementById('details');panel.replaceChildren();text('div','SOURCE EXPLORER',panel,'eyebrow');text('h2',node.label,panel);text('p',node.detail||node.group||'',panel);text('h3','节点位置',panel);for(const ev of node.evidence||[])text('div',`${ev.file}:${ev.line}`,panel,'evidence');const connected=data.edges.filter(e=>e.source===id||e.target===id);text('h3',`直接关系 · ${connected.length}`,panel);for(const e of connected){const div=document.createElement('div');div.className='evidence';panel.append(div);text('strong',`${e.source===id?'→ '+e.target:'← '+e.source}`,div);text('p',`${e.label||'关系'} · ${{observed:'静态证据',inferred:'推断 / 需确认',manual:'手工描述'}[e.confidence||'manual']}`,div);for(const ev of e.evidence||[])text('div',`${ev.file}:${ev.line}`,div)}text('p','证据仅包含路径和行号，没有嵌入源码。',panel)}
function highlight(){const q=document.getElementById('search').value.toLowerCase(),hits=new Set();if(selected)hits.add(selected);else if(q)for(const n of data.nodes)if([n.label,n.id,n.group||''].join(' ').toLowerCase().includes(q))hits.add(n.id);const active=Boolean(q||selected),visible=new Set(hits);for(const e of data.edges)if(hits.has(e.source)||hits.has(e.target)){visible.add(e.source);visible.add(e.target)}for(const [id,g] of nodeEls)g.classList.toggle('dim',active&&!visible.has(id));for(const [e,g] of edgeEls)g.classList.toggle('dim',active&&!(hits.has(e.source)||hits.has(e.target)));document.getElementById('status').textContent=q?`${hits.size} 个匹配`:selected?'已聚焦直接关系':''}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
document.getElementById('title').textContent=data.title;document.getElementById('stats').textContent=`${data.nodes.length} 个节点 / ${data.edges.length} 条关系`;
document.getElementById('search').oninput=()=>{selected=null;highlight()};document.getElementById('reset').onclick=()=>{selected=null;document.getElementById('search').value='';highlight()};document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'浅色模式':'深色模式';draw()};document.getElementById('plus').onclick=()=>{scale=Math.min(3,scale*1.2);resize()};document.getElementById('minus').onclick=()=>{scale=Math.max(.08,scale/1.2);resize()};document.getElementById('fit').onclick=()=>{scale=Math.min(1,(canvas.clientWidth-20)/W,(canvas.clientHeight-20)/H);resize()};document.getElementById('json').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'boboflow.json');document.getElementById('export').onclick=()=>{const copy=svg.cloneNode(true);copy.setAttribute('width',W);copy.setAttribute('height',H);copy.querySelectorAll('[class]').forEach(n=>n.removeAttribute('class'));copy.querySelectorAll('[tabindex]').forEach(n=>{n.removeAttribute('tabindex');n.removeAttribute('role')});download(new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml'}),'boboflow.svg')};draw();if(data.nodes.length<40)document.getElementById('fit').click();
</script></body></html>
